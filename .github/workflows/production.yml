name: Deploy Migrations to Production

# Manual/emergency path only. Automatic migration application now happens as
# a `prebuild` step in the Vercel production build (scripts/db-push.sh), so
# it's atomic with the deploy that needs it. Dispatch this by hand if you
# need to apply migrations without shipping a code deploy.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase link --project-ref $SUPABASE_PROJECT_ID

      - run: supabase db push
